<!DOCTYPE html>
<html>
    <head>
        <title>
            Saloon JukeBox
        </title>
        <link href="https://fonts.googleapis.com/css2?family=Rye&family=Bitter:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="jukeboxcabinet">
        <a href="instructions.html" target="_blank" >How to use this</a>    
        <h1>Jukebox</h1>
        <form id="formtoaddsong">
            <input type="text" id="songtitle" placeholder="Song Title" required>
            <input type="text" id="urlofsong" placeholder="Song Audio Link(Only .mp3 allowed)" required>
            <button type="submit">Add song to Queue</button>
        </form>
        <input type="text" id="searchbox" placeholder="Search">
        <div id = "ptsonglist">
            <div id="topsong" class="smallclass"></div>
            <div id="midsong" class="mainclass"></div> 
            <div id="bottomsong" class="smallclass"></div>
        </div>
        <div id="nowplaying"> Select A Song To Play </div>
        <div id="controls">
            <button id="playpause">Play/Pause</button>
            <button id="skip">Skip</button>
            <div id="volumeknob">
                <div id="knobshow"></div>
            </div>
        </div>
        <button id="enableclearandremove">Enable Clear Queue and remove queue</button>
        <button id="clearqueue" style="display: none;">Clear Whole queue</button>
        <audio id="songplayer"></audio>
        </div>
    <script src="script.js"></script>   
    <
    </body>

</html>
